<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
    <header>
        <h1>Student Task Manager</h1>
        <p class="date">Sat Feb 14 2026</p>
    </header>

    <section class="form-section">
        <p id="errorMessage" class="error"></p>

        <form id="taskForm">
            <input type="text" id="taskName" placeholder="Task Title" required>
            
            <textarea id="taskDescription" placeholder="Task Description" rows="3" required></textarea>
            
            <select id="priority" required>
                <option value="">Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
            
            <input type="date" id="dueDate" required>

            <button type="submit" class="save-btn" id="submitBtn">Save Task</button>
        </form>
    </section>

    <section class="table-section">
        <table border="1" >
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="taskList">
                <tr class="empty-state">
                </tr>
            </tbody>
        </table>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
